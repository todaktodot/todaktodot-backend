# p6spy SQL 로깅 설정

# 커스텀 포맷터 (Hibernate FormatStyle 사용)
logMessageFormat=com.todaktodot.TDTD.global.config.P6SpySqlFormatter

# 로거 설정 (SLF4J 사용)
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 날짜 포맷
dateformat=yyyy-MM-dd HH:mm:ss

# 불필요한 카테고리 제외
excludecategories=info,debug,result,resultset,batch
