spring:
  application:
    name: TDTD

  # 기본 프로파일 설정 (로컬 개발 환경)
  profiles:
    active: dev

  # JPA 공통 설정
  jpa:
    open-in-view: false
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

# 공통 로깅 설정
logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg [%X{traceId:-}]%n'
  level:
    com.todaktodot.TDTD: info

# 에러 응답 설정 (개발 환경)
server:
  error:
    include-message: always
    include-binding-errors: always
    include-exception: false
    include-stacktrace: never

# 배포 알림 설정
deploy:
  notification:
    enabled: false
    n8n-webhook-url: ${N8N_DEPLOY_WEBHOOK_URL:}

# Actuator 설정 (Prometheus 메트릭 수집용)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
