<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">투닥투닷 Admin</title>
    <link rel="icon" type="image/png" href="/image/favicon.png">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <th:block layout:fragment="styles"></th:block>
</head>
<body>
    <div class="admin-container">
        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-wrapper">
                    <img th:src="@{/image/todaktodot_logo.png}" alt="투닥투닷" class="logo-img">
                    <h1 class="logo">투닥투닷</h1>
                </div>
                <span class="subtitle">Admin</span>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <!-- AI 프롬프트 관리 -->
                    <li>
                        <a th:href="@{/admin/prompt}"
                           th:classappend="${activeMenu == 'prompt'} ? 'active' : ''">
                            <span class="icon">📝</span>
                            <span>AI 프롬프트 관리</span>
                        </a>
                    </li>
                    <!-- 데일리카드 -->
                    <li class="nav-category" data-category="dailycard"
                        th:classappend="${#strings.contains('generate,dailycard,dailycard-assign', activeMenu)} ? 'open' : ''">
                        <a href="javascript:void(0)" class="nav-category-toggle">
                            <span class="icon">📋</span>
                            <span>데일리카드</span>
                            <span class="arrow">&#9662;</span>
                        </a>
                        <ul class="nav-submenu">
                            <li>
                                <a th:href="@{/admin/daily-card/generate}"
                                   th:classappend="${activeMenu == 'generate'} ? 'active' : ''">
                                    <span>✨ 데일리카드 AI 생성</span>
                                </a>
                            </li>
                            <li>
                                <a th:href="@{/admin/daily-card}"
                                   th:classappend="${activeMenu == 'dailycard'} ? 'active' : ''">
                                    <span>데일리카드 관리</span>
                                </a>
                            </li>
                            <li>
                                <a th:href="@{/admin/daily-card-assign}"
                                   th:classappend="${activeMenu == 'dailycard-assign'} ? 'active' : ''">
                                    <span>데일리카드 배정</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                    <!-- AI 피드백 -->
                    <li class="nav-category" data-category="feedback"
                        th:classappend="${activeMenu == 'feedback'} ? 'open' : ''">
                        <a href="javascript:void(0)" class="nav-category-toggle">
                            <span class="icon">💬</span>
                            <span>AI 피드백</span>
                            <span class="arrow">&#9662;</span>
                        </a>
                        <ul class="nav-submenu">
                            <li>
                                <a th:href="@{/admin/feedback}"
                                   th:classappend="${activeMenu == 'feedback'} ? 'active' : ''">
                                    <span>✨ AI 피드백 관리</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                    <!-- AI 인사이트 -->
                    <li class="nav-category" data-category="insight"
                        th:classappend="${activeMenu == 'insight'} ? 'open' : ''">
                        <a href="javascript:void(0)" class="nav-category-toggle">
                            <span class="icon">💡</span>
                            <span>AI 인사이트</span>
                            <span class="arrow">&#9662;</span>
                        </a>
                        <ul class="nav-submenu">
                            <li>
                                <a th:href="@{/admin/insight}"
                                   th:classappend="${activeMenu == 'insight'} ? 'active' : ''">
                                    <span>✨ AI 인사이트 관리</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                    <!-- 커플 -->
                    <li class="nav-category" data-category="couple"
                        th:classappend="${activeMenu == 'couple'} ? 'open' : ''">
                        <a href="javascript:void(0)" class="nav-category-toggle">
                            <span class="icon">💑</span>
                            <span>커플</span>
                            <span class="arrow">&#9662;</span>
                        </a>
                        <ul class="nav-submenu">
                            <li>
                                <a th:href="@{/admin/couple}"
                                   th:classappend="${activeMenu == 'couple'} ? 'active' : ''">
                                    <span>커플 관리</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- 메인 콘텐츠 -->
        <main class="main-content">
            <header class="content-header">
                <h2 layout:fragment="pageTitle">페이지 제목</h2>
            </header>
            <div class="content-body" layout:fragment="content">
                <!-- 페이지별 콘텐츠가 여기에 들어갑니다 -->
            </div>
        </main>
    </div>

    <script th:src="@{/js/admin.js}"></script>
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
