<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>프롬프트 수정</title>
</head>
<body>
    <h2 layout:fragment="pageTitle">프롬프트 수정</h2>

    <div layout:fragment="content">
        <!-- 상단 액션 버튼 -->
        <div style="margin-bottom: 20px;">
            <a th:href="@{/admin/prompt/prompt/{id}(id=${prompt.promptId})}" class="btn btn-secondary">&larr; 돌아가기</a>
        </div>

        <form th:action="@{/admin/prompt/prompt/{id}/edit(id=${prompt.promptId})}" method="post">
            <div class="card">
                <div class="card-header">
                    <h3>프롬프트 정보</h3>
                    <span>
                        <span class="badge badge-coffee" th:text="${prompt.promptName}">DAILY_CARD_GENERATE</span>
                        <span style="color: #7f8c8d; margin-left: 8px;">v<span th:text="${prompt.version}">1</span></span>
                    </span>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="promptDesc">설명</label>
                        <input type="text" id="promptDesc" name="promptDesc"
                               th:value="${prompt.promptDesc}"
                               placeholder="프롬프트에 대한 설명을 입력해주세요.">
                    </div>

                    <div class="form-group">
                        <label for="promptContent">프롬프트 내용 *</label>
                        <textarea id="promptContent" name="promptContent" rows="25" required
                                  style="font-family: monospace; font-size: 0.9rem;"
                                  th:text="${prompt.promptContent}"></textarea>
                        <small style="color: #7f8c8d;">
                            변수 치환을 위해 %s 또는 %d 형식을 사용할 수 있습니다.
                        </small>
                    </div>
                </div>
            </div>

            <!-- 저장 버튼 -->
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                <a th:href="@{/admin/prompt/prompt/{id}(id=${prompt.promptId})}" class="btn btn-secondary">취소</a>
                <button type="submit" class="btn btn-primary">저장</button>
            </div>
        </form>
    </div>
</body>
</html>
