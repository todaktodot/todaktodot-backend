<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>카테고리 수정</title>
</head>
<body>
    <h2 layout:fragment="pageTitle">카테고리 수정</h2>

    <div layout:fragment="content">
        <!-- 상단 액션 버튼 -->
        <div style="margin-bottom: 20px;">
            <a th:href="@{/admin/prompt}" class="btn btn-secondary">&larr; 목록으로</a>
        </div>

        <form th:action="@{/admin/prompt/category/{id}/edit(id=${category.categoryId})}" method="post">
            <div class="card">
                <div class="card-header">
                    <h3>카테고리 정보</h3>
                    <span class="badge"
                          th:classappend="'badge-' + ${category.subject.name().toLowerCase()}"
                          th:text="${category.subjectDisplayName}">연애관</span>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label>주제</label>
                            <div>
                                <span class="badge"
                                      th:classappend="'badge-' + ${category.subject.name().toLowerCase()}"
                                      th:text="${category.subjectDisplayName}">연애관</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="sortOrder">정렬 순서</label>
                            <input type="number" id="sortOrder" name="sortOrder"
                                   th:value="${category.sortOrder}" min="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="categoryName">카테고리명 *</label>
                        <input type="text" id="categoryName" name="categoryName" required
                               th:value="${category.categoryName}">
                    </div>

                    <div class="form-group">
                        <label for="categoryDesc">설명</label>
                        <input type="text" id="categoryDesc" name="categoryDesc"
                               th:value="${category.categoryDesc}"
                               placeholder="카테고리에 대한 설명을 입력해주세요.">
                    </div>
                </div>
            </div>

            <!-- 저장 버튼 -->
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: space-between;">
                <form th:action="@{/admin/prompt/category/{id}/delete(id=${category.categoryId})}"
                      method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
                </form>
                <div style="display: flex; gap: 10px;">
                    <a th:href="@{/admin/prompt}" class="btn btn-secondary">취소</a>
                    <button type="submit" class="btn btn-primary">저장</button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
