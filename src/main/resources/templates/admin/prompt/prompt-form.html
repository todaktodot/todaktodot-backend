<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>프롬프트 생성</title>
</head>
<body>
    <h2 layout:fragment="pageTitle">새 프롬프트 생성</h2>

    <div layout:fragment="content">
        <!-- 상단 액션 버튼 -->
        <div style="margin-bottom: 20px;">
            <a th:href="@{/admin/prompt}" class="btn btn-secondary">&larr; 목록으로</a>
        </div>

        <form th:action="@{/admin/prompt/prompt/new}" method="post">
            <div class="card">
                <div class="card-header">
                    <h3>프롬프트 정보</h3>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="promptName">프롬프트명 *</label>
                        <input type="text" id="promptName" name="promptName" required
                               placeholder="예: DAILY_CARD_GENERATE">
                        <small style="color: #7f8c8d;">영문 대문자, 언더스코어(_)를 사용해주세요.</small>
                    </div>

                    <div class="form-group">
                        <label for="promptDesc">설명</label>
                        <input type="text" id="promptDesc" name="promptDesc"
                               placeholder="프롬프트에 대한 설명을 입력해주세요.">
                    </div>

                    <div class="form-group">
                        <label for="promptContent">프롬프트 내용 *</label>
                        <textarea id="promptContent" name="promptContent" rows="20" required
                                  placeholder="AI에게 보낼 프롬프트 내용을 입력해주세요."
                                  style="font-family: monospace; font-size: 0.9rem;"></textarea>
                        <small style="color: #7f8c8d;">
                            변수 치환을 위해 %s 또는 %d 형식을 사용할 수 있습니다.
                        </small>
                    </div>
                </div>
            </div>

            <!-- 저장 버튼 -->
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                <a th:href="@{/admin/prompt}" class="btn btn-secondary">취소</a>
                <button type="submit" class="btn btn-primary">생성</button>
            </div>
        </form>
    </div>
</body>
</html>
