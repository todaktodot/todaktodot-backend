<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>데일리카드 수정</title>
</head>
<body>
    <h2 layout:fragment="pageTitle">데일리카드 수정</h2>

    <div layout:fragment="content">
        <!-- 상단 액션 버튼 -->
        <div style="margin-bottom: 20px;">
            <a th:href="@{/admin/daily-card/{id}(id=${card.cardId})}" class="btn btn-secondary">&larr; 돌아가기</a>
        </div>

        <form th:action="@{/admin/daily-card/{id}/edit(id=${card.cardId})}" method="post">
            <!-- 수정 불가 필드들 (hidden으로 전송) -->
            <input type="hidden" name="mode" th:value="${card.mode}">
            <input type="hidden" name="subject" th:value="${card.subject}">
            <input type="hidden" name="type" th:value="${card.type}">

            <!-- 카드 기본 정보 -->
            <div class="card">
                <div class="card-header">
                    <h3>기본 정보</h3>
                </div>
                <div class="card-body">
                    <!-- 모드/주제/유형 (수정 불가, 상세 페이지와 동일 형식) -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>카드 ID</label>
                            <div th:text="${card.cardId}">1</div>
                        </div>
                        <div class="form-group">
                            <label>모드</label>
                            <div>
                                <span class="badge"
                                      th:classappend="'badge-' + ${card.mode.name().toLowerCase()}"
                                      th:text="${card.modeDisplayName}">디저트</span>
                                <small th:text="${card.mode.description}" style="color: #7f8c8d; margin-left: 8px;"></small>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>주제</label>
                            <div>
                                <span class="badge"
                                      th:classappend="'badge-' + ${card.subject.name().toLowerCase()}"
                                      th:text="${card.subjectDisplayName}">연애관</span>
                                <small th:text="${card.subject.description}" style="color: #7f8c8d; margin-left: 8px;"></small>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>유형</label>
                            <div>
                                <span class="badge"
                                      th:classappend="'badge-' + ${card.type.name().toLowerCase()}"
                                      th:text="${card.typeDisplayName}">상황극</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="useYn">상태</label>
                            <select id="useYn" name="useYn" style="min-width: 120px;">
                                <option value="Y" th:selected="${card.useYn == 'Y'}">활성</option>
                                <option value="N" th:selected="${card.useYn == 'N'}">비활성</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="cardTitle">카드 제목 (상황 설명) *</label>
                        <textarea id="cardTitle" name="cardTitle" rows="4" required
                                  th:text="${card.cardTitle}"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="situation">상황 (소제목)</label>
                        <p class="form-hint">현재 카드 주제의 예시 상황을 선택할 수 있습니다. 선택을 해제하면 기존 저장값이 유지됩니다.</p>

                        <div class="category-chips">
                            <button type="button"
                                    th:each="category : ${situationOptions}"
                                    class="category-chip category-chip-button situation-chip-option"
                                    th:classappend="${selectedSituation == category.categoryName} ? ' selected' : ''"
                                    th:data-category="${category.categoryName}">
                                <span th:text="${category.categoryName}">기념일/이벤트</span>
                            </button>

                            <span th:if="${selectedSituation != null and !selectedSituation.isBlank() and selectedSituationCompatibilityState != null}"
                                  class="category-chip compatibility selected">
                                <span th:text="${selectedSituation}">기존 상황</span>
                                <span class="category-chip-meta"
                                      th:text="${selectedSituationCompatibilityState == 'inactive'} ? '비활성' : '현재 저장값'">비활성</span>
                            </span>
                        </div>

                        <p th:if="${#lists.isEmpty(situationOptions)}" class="form-hint" style="margin-top: 12px; margin-bottom: 0;">
                            등록된 예시 상황이 없습니다. 현재 저장값이 있으면 호환 칩으로 함께 표시되며, 없으면 기존 값이 그대로 유지됩니다.
                        </p>

                        <p th:if="${situationError}" class="error-message" th:text="${situationError}">현재 카드 주제에서 선택할 수 없는 상황입니다.</p>

                        <input type="hidden" id="situation" name="situation" th:value="${selectedSituation}">
                    </div>
                </div>
            </div>

            <!-- 질문 수정 -->
            <div class="card">
                <div class="card-header">
                    <h3>질문 수정</h3>
                </div>
                <div class="card-body">
                    <div th:each="question, qStat : ${card.questions}" class="question-item">
                        <input type="hidden" th:name="'questions[' + ${qStat.index} + '].questionNo'"
                               th:value="${question.questionNo}">
                        <input type="hidden" th:name="'questions[' + ${qStat.index} + '].questionType'"
                               th:value="${question.questionType}">

                        <div class="question-header">
                            <div>
                                <strong>질문 [[${qStat.count}]]</strong>
                                <span class="badge" style="margin-left: 8px;"
                                      th:classappend="${question.questionType.name() == 'MULTIPLE_CHOICE'} ? 'badge-roleplay' : 'badge-balance'"
                                      th:text="${question.questionTypeDisplayName}">객관식</span>
                            </div>
                            <div>
                                <label style="font-weight: normal; font-size: 0.9rem;">
                                    <input type="checkbox"
                                           th:name="'questions[' + ${qStat.index} + '].answerReqYn'"
                                           th:checked="${question.required}"
                                           value="Y"> 필수 답변
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>질문 내용</label>
                            <textarea th:name="'questions[' + ${qStat.index} + '].questionCnts'"
                                      rows="2" required
                                      th:text="${question.questionCnts}"></textarea>
                        </div>

                        <!-- 선택지 (객관식인 경우) -->
                        <div th:if="${!#lists.isEmpty(question.options)}"
                             th:id="'options-' + ${question.questionNo}">
                            <label style="font-weight: 500; margin-bottom: 8px; display: block;">선택지</label>
                            <div th:each="option, oStat : ${question.options}" class="option-item">
                                <span class="option-number" th:text="${option.optionNo}">1</span>
                                <input type="hidden"
                                       th:name="'questions[' + ${qStat.index} + '].options[' + ${oStat.index} + '].optionNo'"
                                       th:value="${option.optionNo}">
                                <input type="text"
                                       th:name="'questions[' + ${qStat.index} + '].options[' + ${oStat.index} + '].optionCnts'"
                                       th:value="${option.optionCnts}"
                                       class="option-input"
                                       style="flex: 1; padding: 8px 12px; border: 1px solid #dce4ec; border-radius: 4px;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 저장 버튼 -->
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                <a th:href="@{/admin/daily-card/{id}(id=${card.cardId})}" class="btn btn-secondary">취소</a>
                <button type="submit" class="btn btn-primary">저장</button>
            </div>
        </form>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const situationInput = document.getElementById('situation');
                const situationChips = document.querySelectorAll('.situation-chip-option');

                situationChips.forEach(chip => {
                    chip.addEventListener('click', function() {
                        const selectedCategory = this.dataset.category;

                        situationChips.forEach(option => option.classList.remove('selected'));

                        if (situationInput.value === selectedCategory) {
                            situationInput.value = '';
                            return;
                        }

                        this.classList.add('selected');
                        situationInput.value = selectedCategory;
                    });
                });
            });
        </script>
    </th:block>
</body>
</html>
