name: Deploy Dev Server

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 배포 시작 알림 (GitHub Actions -> Discord)
      - name: Notify Deploy Start
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          JSON_PAYLOAD=$(jq -n \
            --arg title "🚀 개발 서버 배포 시작" \
            --arg desc "**커밋:** $COMMIT_MESSAGE"$'\n'"**실행자:** ${{ github.actor }}" \
            --arg timestamp "$(TZ=Asia/Seoul date +"%Y-%m-%dT%H:%M:%S+09:00")" \
            --arg color 3447003 \
            '{embeds: [{title: $title, description: $desc, timestamp: $timestamp, color: ($color | tonumber)}]}')

          curl -f -s -m 10 -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"

      # 2. SSH로 EC2 접속하여 deploy.sh 실행
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 개발 서버 배포 시작"
            /home/ec2-user/deploy.sh

      # 3. 배포 성공 알림 (GitHub Actions -> Discord)
      - name: Notify Deploy Success
        if: success()
        run: |
          JSON_PAYLOAD=$(jq -n \
            --arg title "✅ 개발 서버 배포 성공" \
            --arg desc "**실행자:** ${{ github.actor }}" \
            --arg timestamp "$(TZ=Asia/Seoul date +"%Y-%m-%dT%H:%M:%S+09:00")" \
            --arg color 65280 \
            '{embeds: [{title: $title, description: $desc, timestamp: $timestamp, color: ($color | tonumber)}]}')

          curl -f -s -m 10 -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"

      # 4. 배포 실패 알림 (GitHub Actions -> Discord)
      - name: Notify Deploy Failure
        if: failure()
        run: |
          JSON_PAYLOAD=$(jq -n \
            --arg title "🚨 개발 서버 배포 실패" \
            --arg desc "EC2 배포 과정에서 에러가 발생했습니다."$'\n'"GitHub Actions 로그를 확인해주세요."$'\n'"**실행자:** ${{ github.actor }}" \
            --arg timestamp "$(TZ=Asia/Seoul date +"%Y-%m-%dT%H:%M:%S+09:00")" \
            --arg color 16711680 \
            '{embeds: [{title: $title, description: $desc, timestamp: $timestamp, color: ($color | tonumber)}]}')

          curl -f -s -m 10 -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"
