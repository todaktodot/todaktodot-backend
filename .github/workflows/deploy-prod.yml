name: Production Deploy

# 1. 트리거 설정: 수동 실행 버튼 활성화
on:
  workflow_dispatch:
    inputs:
      reason:
        required: false
        default: '정기 운영 배포'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 운영 브랜치(main)에서 실행할 때만 동작하도록 보호
    if: github.ref == 'refs/heads/prod'

    steps:
      # 1. 배포 시작 알림 (GitHub Actions -> Discord)
      - name: Notify Deploy Start
        run: |
          JSON_PAYLOAD=$(jq -n \
            --arg title "🚀 운영 서버 배포 시작" \
            --arg desc "**실행자:** ${{ github.actor }}" \
            --arg timestamp "$(TZ=Asia/Seoul date +"%Y-%m-%dT%H:%M:%S+09:00")" \
            --arg color 3447003 \
            '{embeds: [{title: $title, description: $desc, timestamp: $timestamp, color: ($color | tonumber)}]}')

          curl -f -s -m 10 -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"

      # 2. SSH로 EC2 접속하여 미리 만들어둔 deploy.sh 실행
      - name: Execute Deploy Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ${{ secrets.EC2_USERNAME_PROD }}
          key: ${{ secrets.EC2_SSH_KEY_PROD }}
          script: |
            echo "🚀 운영 배포 시작"
            cd /home/ubuntu/app
            ./deploy.sh

      # 3. 배포 성공 알림 (GitHub Actions -> Discord)
      - name: Notify Deploy Success
        if: success() # 위 스텝이 모두 정상 통과했을 때만 실행
        run: |
          JSON_PAYLOAD=$(jq -n \
            --arg title "✅ 운영 서버 배포 성공" \
            --arg desc "**실행자:** ${{ github.actor }}" \
            --arg timestamp "$(TZ=Asia/Seoul date +"%Y-%m-%dT%H:%M:%S+09:00")" \
            --arg color 65280 \
            '{embeds: [{title: $title, description: $desc, timestamp: $timestamp, color: ($color | tonumber)}]}')

          curl -f -s -m 10 -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"

      # 4. 배포 실패 알림 (GitHub Actions -> Discord)
      - name: Notify Deploy Failure
        if: failure() # 중간에 하나라도 실패(에러)가 났을 때 실행
        run: |
          JSON_PAYLOAD=$(jq -n \
            --arg title "🚨 운영 서버 배포 실패" \
            --arg desc "EC2 배포 과정(`deploy.sh`)에서 에러가 발생했습니다."$'\n'"GitHub Actions 로그를 확인해주세요."$'\n'"**실행자:** ${{ github.actor }}" \
            --arg timestamp "$(TZ=Asia/Seoul date +"%Y-%m-%dT%H:%M:%S+09:00")" \
            --arg color 16711680 \
            '{embeds: [{title: $title, description: $desc, timestamp: $timestamp, color: ($color | tonumber)}]}')

          curl -f -s -m 10 -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"

